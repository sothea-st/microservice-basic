server:
  port: 9091

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/orders/**

# this means register api-gateway to eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
     prefer-ip-address: true
     hostname: localhost